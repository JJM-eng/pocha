<script type="module">
  window.__osdk = (async () => {
    try {
      const m = await Promise.race([import('https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js'), new Promise((_, r) => setTimeout(() => r('timeout'), 8000))]);
      const sdk = m.createSDK();
      sdk.on('pause', () => window.dispatchEvent(new Event('osdk-pause')));
      sdk.on('resume', () => window.dispatchEvent(new Event('osdk-resume')));
      try { sdk.setLoadingProgress(10); } catch (e) {}
      await sdk.initializeAsync();
      try { sdk.setLoadingProgress(100); } catch (e) {}
      try { await sdk.startGameAsync(); } catch (e) {}
      window.__osdkSdk = sdk; return sdk;
    } catch (e) { return null; }
  })();
</script>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const LW = 360, LH = 640; let K = 1, OX = 0, OY = 0;
  function resize(){ const r = cv.getBoundingClientRect(), d = Math.min(2.5, window.devicePixelRatio || 1); cv.width = r.width * d; cv.height = r.height * d; K = Math.min(cv.width / LW, cv.height / LH); OX = (cv.width - LW * K) / 2; OY = (cv.height - LH * K) / 2; }
  addEventListener('resize', resize);

  // ---------- art ----------
  let IMG_N = 0, IMG_D = 0; const _Img = window.Image; window.Image = function(){ const im = new _Img(); IMG_N++; const done = () => { IMG_D++; const b = document.getElementById('loadBar'); if (b) b.style.width = Math.round(IMG_D / IMG_N * 100) + '%'; if (IMG_D >= IMG_N) setTimeout(hideLoad, 250); }; im.addEventListener('load', done); im.addEventListener('error', done); return im; };
  function hideLoad(){ const l = document.getElementById('load'); if (l) l.classList.add('hide'); }
  setTimeout(hideLoad, 6000);
  const ART = {}, MOBS = ['slime','goblin','wolf','mushroom','scorpion','mummy','yeti','icebat','imp','lavaslime','skeleton','darkknight'];
  const BOSSES = ['kingslime','treant','sandworm','frostgolem','firedrake','demonlord'];
  [...MOBS.map(m => 'mob_' + m), ...BOSSES.map(b => 'boss_' + b), 'bg_1', 'bg_field', 'tex_road', 'tile_slot'].forEach(n => { const im = new Image(); im.onload = () => ART[n] = im; im.src = 'art/' + n + '.webp'; });

  const WALKS = ['goblin','wolf','mushroom','scorpion','mummy','yeti','skeleton','darkknight','demonlord','frostgolem','treant'];
  WALKS.forEach(t => { for (let k = 0; k < 4; k++){ const im = new Image(), n = `mwalk${k}_${t}`; im.onload = () => ART[n] = im; im.src = 'art/' + n + '.webp'; } });
  const WH = new Map(); function whiteOf(im){ let c = WH.get(im); if (c) return c; c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); WH.set(im, c); return c; }
  // ---------- board ----------
  const COLS = 6, ROWS = 3, CELL = 44, PAD = 20, ROADW = 28;
  function mkF(gy){ const gx = (LW - COLS * CELL) / 2, P = { x0: gx - PAD, y0: gy - PAD, x1: gx + COLS * CELL + PAD, y1: gy + ROWS * CELL + PAD }, PW = P.x1 - P.x0, PH = P.y1 - P.y0; return { GX: gx, GY: gy, P, PW, PH, PLEN: 2 * (PW + PH) }; }
  const FL = [mkF(300), mkF(96)], GX = FL[0].GX, GY = FL[0].GY;
  function pathPos(d, f = 0){ const F = FL[f], P = F.P, PW = F.PW, PH = F.PH, PLEN = F.PLEN; d = ((d % PLEN) + PLEN) % PLEN;
    if (d < PW) return [P.x0 + d, P.y0]; d -= PW;
    if (d < PH) return [P.x1, P.y0 + d]; d -= PH;
    if (d < PW) return [P.x1 - d, P.y1]; d -= PW;
    return [P.x0, P.y1 - d]; }
  const cellXY = (i, f = 0) => [FL[f].GX + (i % COLS) * CELL + CELL / 2, FL[f].GY + Math.floor(i / COLS) * CELL + CELL / 2];

  // ---------- units ----------
  const RAR = [
    { n: '일반', c: '#b8c0cc', g: '#6a7280' },
    { n: '희귀', c: '#5cc8ff', g: '#1f6aa8' },
    { n: '영웅', c: '#c08cff', g: '#6a34b0' },
    { n: '전설', c: '#ffd447', g: '#b07a10' },
    { n: '신화', c: '#ff6a8a', g: '#b0203e' },
  ];
  // kind: melee(short range fast), arrow(long range), magic(splash), slow, chain, multi
  const UNITS = [
    { id:'sword1', r:0, name:'견습 검사',   e:'🗡️', kind:'melee', dmg:14, spd:1.4, rng:62 },
    { id:'bow1',   r:0, name:'견습 궁수',   e:'🏹', kind:'arrow', dmg:9,  spd:1.1, rng:150 },
    { id:'mage1',  r:0, name:'견습 마법사', e:'🔮', kind:'magic', dmg:7,  spd:0.8, rng:120, aoe:26 },
    { id:'sword2', r:1, name:'기사',        e:'⚔️', kind:'melee', dmg:42, spd:1.5, rng:66 },
    { id:'bow2',   r:1, name:'사냥꾼',      e:'🎯', kind:'arrow', dmg:28, spd:1.2, rng:160 },
    { id:'ice2',   r:1, name:'얼음술사',    e:'❄️', kind:'slow',  dmg:16, spd:0.9, rng:130, aoe:30, slow:0.4 },
    { id:'sword3', r:2, name:'성기사',      e:'🛡️', kind:'melee', dmg:130,spd:1.6, rng:70 },
    { id:'bow3',   r:2, name:'저격수',      e:'🔭', kind:'arrow', dmg:120,spd:0.7, rng:240 },
    { id:'fire3',  r:2, name:'화염술사',    e:'🔥', kind:'magic', dmg:60, spd:0.9, rng:140, aoe:36 },
    { id:'sword4', r:3, name:'검성',        e:'🌀', kind:'melee', dmg:420,spd:1.8, rng:76 },
    { id:'bow4',   r:3, name:'바람 궁수',   e:'🍃', kind:'multi', dmg:190,spd:1.2, rng:180, n:3 },
    { id:'bolt4',  r:3, name:'번개 마도사', e:'⚡', kind:'chain', dmg:230,spd:1.0, rng:160, n:4 },
    { id:'drag5',  r:4, name:'용기사',      e:'🐉', kind:'magic', dmg:1300,spd:1.3,rng:120, aoe:40 },
    { id:'star5',  r:4, name:'천궁',        e:'🌟', kind:'multi', dmg:700,spd:1.6, rng:260, n:5 },
    { id:'arch5',  r:4, name:'대마법사',    e:'☄️', kind:'chain', dmg:900,spd:1.1, rng:220, n:6, slow:0.3 },
  ];
  const byRar = r => UNITS.filter(u => u.r === r);
  // ---------- meta (save) ----------
  const SKEY = 'luckdef_v1', today = () => new Date().toISOString().slice(0, 10);
  let M = { gold: 300, gem: 30, best: 0, lv: {}, seen: {}, day: '', q: {}, qc: {}, att: 0, attDay: '', free: '', games: 0 };
  try { Object.assign(M, JSON.parse(localStorage.getItem(SKEY) || '{}')); } catch(e){}
  const save = () => { try { localStorage.setItem(SKEY, JSON.stringify(M)); } catch(e){} };
  function dayRoll(){ if (M.day !== today()){ M.day = today(); M.q = {}; M.qc = {}; M.tk = {}; save(); } }
  const upMul = id => 1 + 0.12 * (M.lv[id] || 0);
  const upCost = u => Math.floor([40, 120, 360, 900, 2400][u.r] * Math.pow(1.35, M.lv[u.id] || 0));
  const QUESTS = [ { id: 'play', n: '전투 3판 하기', goal: 3, gem: 10 }, { id: 'summon', n: '수호자 60번 소환', goal: 60, gem: 10 }, { id: 'wave', n: '한 판에 15웨이브 도달', goal: 15, gem: 15, max: true }, { id: 'myth', n: '신화 수호자 만들기', goal: 1, gem: 20 }, { id: 'boss', n: '보스 3마리 처치', goal: 3, gem: 15 } ];
  function qAdd(id, v = 1, max = false){ dayRoll(); M.q[id] = max ? Math.max(M.q[id] || 0, v) : (M.q[id] || 0) + v; }
  const ATT = [100, 300, 10, 500, 20, 800, 50];
  const MODES = [ { n: '일반', hp: 1, rw: 1, c: '#6ee07a' }, { n: '하드', hp: 2.4, rw: 1.8, c: '#ffb347' }, { n: '지옥', hp: 6, rw: 3, c: '#ff4a6a' } ];
  M.mode = M.mode || 0; M.bm = M.bm || [M.best || 0, 0, 0]; M.tr = M.tr || {};
  const modeOpen = k => k === 0 || (M.bm[k - 1] || 0) >= 20;

    $('shopPrem').innerHTML = `<div class="row"><div style="font-size:30px">👑</div><div class="t">30일 프리미엄 이용권<small>${on ? `<b style="color:#8cf08c">이용 중 · ${passDays()}일 남음</b>` : !ok ? '<b style="color:#ff8a8a">기기 시간이 이상해요 · 인터넷 연결 후 다시 확인돼요</b>' : '2배속 무제한 · 광고 없이 보상 · 매일 💎30'}</small></div><button class="sbtn" data-b="td_pass30" style="background:linear-gradient(#ffe27a,#ffb21e);color:#3a2206">${on ? '연장 ' : ''}${priceOf('td_pass30')}</button></div>
      ${on ? `<div class="row"><div style="font-size:26px">💎</div><div class="t">이용권 일일 보석<small>매일 💎30</small></div><button class="sbtn" id="bPassGem" ${M.passGem === today() ? 'disabled' : ''}>${M.passGem === today() ? '받음' : '받기'}</button></div>` : ''}
      <div class="row"><div style="font-size:30px">⏩</div><div class="t">영구 2배속<small>${M.perm2x ? '<b style="color:#8cf08c">보유 중</b>' : '한 번 사면 평생 2배속'}</small></div><button class="sbtn" data-b="td_speed" ${M.perm2x ? 'disabled' : ''} style="background:linear-gradient(#c9a8ff,#7a4ad8);color:#fff">${M.perm2x ? '보유' : priceOf('td_speed')}</button></div>
      <button class="btn2" id="bRestore" style="font-size:13px;padding:8px 0">🔄 구매 복원</button>`;
    $('shopPay').innerHTML = IAPX.filter(q => q.id.startsWith('td_gem')).map(q => `<div class="row"><div style="font-size:26px">${q.e}</div><div class="t">${q.name}<small>${q.desc}</small></div><button class="sbtn" data-b="${q.id}">${q.price}</button></div>`).join('') + `<div class="sub" style="margin-top:8px;font-size:11px"><a href="prob.html" target="_blank" style="color:#9a92c0">확률 정보</a> · <a href="terms.html" target="_blank" style="color:#9a92c0">이용약관</a> · <a href="privacy.html" target="_blank" style="color:#9a92c0">개인정보처리방침</a></div>`;
    document.querySelectorAll('#pgShop [data-b]').forEach(b => b.onclick = () => buy(IAPX.find(q => q.id === b.dataset.b)));
    $('bRestore').onclick = restore;
    if ($('bPassGem')) $('bPassGem').onclick = () => { if (!passOn() || M.passGem === today()) return; M.passGem = today(); M.gem += 30; save(); toast('💎 +30'); renderHome(); };
  }
  function audioUI(){ $('hBgm').style.opacity = BGM.on ? 1 : 0.4; $('hSfx').style.opacity = MUTE ? 0.4 : 1; }
  BGM.on = M.bgm !== false; MUTE = M.sfx === false;
  $('hBgm').onclick = () => { BGM.on = !BGM.on; M.bgm = BGM.on; save(); if (BGM.on) BGM.kick(); else BGM.stop(); audioUI(); };
  $('hSfx').onclick = () => { MUTE = !MUTE; M.sfx = !MUTE; save(); audioUI(); };
  function renderHome(){ dayRoll(); renderShop(); audioUI(); BGM.play('home');
    $('hGold').textContent = M.gold.toLocaleString(); $('hGem').textContent = M.gem; $('hBest').textContent = '🏆 ' + M.best + '웨이브';
    const top = [...UNITS].filter(u => M.seen[u.id]).sort((a, b) => b.r - a.r || (M.lv[b.id] || 0) - (M.lv[a.id] || 0));
    const hero = top[0] || UB('drag5'), sides = top.filter(u => u !== hero).slice(0, 2); $('hHero').src = uimg(hero.id);
    $('hSideL').src = uimg((sides[0] || UB('sword1')).id); $('hSideR').src = uimg((sides[1] || UB('mage1')).id);
    $('hTip').textContent = M.best ? `최고 ${M.best}웨이브 · 판이 끝나면 골드 획득` : '몬스터 100마리가 넘으면 패배!';
    // units
    $('uGrid').innerHTML = UNITS.map(u => { const R = RAR[u.r], lv = M.lv[u.id] || 0, c = upCost(u), lock = !M.seen[u.id];
      return `<div class="uc ${lock ? 'lock' : ''}" style="border-color:${R.c};background:linear-gradient(${R.g}55,#14102a)"><span class="lv">Lv.${lv + 1}</span><img src="${uimg(u.id)}"><div class="nm" style="color:${R.c}">${lock ? '???' : u.name}</div>
        <button data-u="${u.id}" ${lock || M.gold < c ? 'disabled' : ''}>${lock ? '미발견' : '🪙 ' + c.toLocaleString()}</button></div>`; }).join('');
    $('uGrid').querySelectorAll('button[data-u]').forEach(b => b.onclick = () => { const u = UB(b.dataset.u), c = upCost(u); if (M.gold < c) return; M.gold -= c; M.lv[u.id] = (M.lv[u.id] || 0) + 1; save(); SFX.merge(); toast(`${u.name} Lv.${M.lv[u.id] + 1}!`); renderHome(); });
    $('recList').innerHTML = RECIPES.map(rc => `<div class="row"><img src="${uimg(rc.out)}" style="height:44px"><div class="t" style="color:#ff8aa8">${UB(rc.out).name}<small>${rc.need.map(id => UB(id).name).join(' + ')}</small></div></div>`).join('');
    // shop
    const freeOk = M.free !== today();
    $('shopFree').innerHTML = `<div class="row"><div style="font-size:30px">🎁</div><div class="t">매일 무료 보급<small>골드 300 + 보석 5</small></div><button class="sbtn" id="bFree" ${freeOk ? '' : 'disabled'}>${freeOk ? '받기' : '내일 다시'}</button></div>`;
    $('bFree').onclick = () => { if (M.free === today()) return; M.free = today(); M.gold += 300; M.gem += 5; save(); toast('🪙 +300  💎 +5'); renderHome(); };
    const GX2 = [ [20, 600], [60, 2000], [150, 5500] ];
    $('shopGem').innerHTML = GX2.map(([g, o], k) => `<div class="row"><div style="font-size:26px">${['💰', '💰💰', '🏦'][k]}</div><div class="t">골드 ${o.toLocaleString()}<small>보석 ${g}개</small></div><button class="sbtn" data-k="${k}" ${M.gem < g ? 'disabled' : ''}>💎 ${g}</button></div>`).join('');
    $('shopGem').querySelectorAll('button').forEach(b => b.onclick = () => { const [g, o] = GX2[+b.dataset.k]; if (M.gem < g) return; M.gem -= g; M.gold += o; save(); toast(`🪙 +${o}`); renderHome(); });
    // attendance
    const attOk = M.attDay !== today(), di = M.att % 7;
    $('attList').innerHTML = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${ATT.map((v, k) => `<div style="text-align:center;border-radius:10px;padding:6px 0;font-size:11px;font-weight:900;background:${k < di ? '#2c5a34' : k === di && attOk ? '#7a5a10' : '#2a2446'};border:1.5px solid ${k === di && attOk ? '#ffd447' : 'transparent'}">${k + 1}일<br>${[2, 4, 6].includes(k) ? '💎' : '🪙'}<br>${v}</div>`).join('')}</div>
      <button class="sbtn" id="bAtt" style="width:100%;margin-top:8px" ${attOk ? '' : 'disabled'}>${attOk ? '출석 보상 받기' : '오늘 출석 완료'}</button>`;
    $('bAtt').onclick = () => { if (M.attDay === today()) return; const v = ATT[M.att % 7]; if ([2, 4, 6].includes(M.att % 7)) M.gem += v; else M.gold += v; M.att++; M.attDay = today(); save(); toast('출석 보상 받았어요!'); renderHome(); };
    // quests
    $('qList').innerHTML = QUESTS.map(q => { const v = Math.min(q.goal, M.q[q.id] || 0), done = v >= q.goal, got = M.qc[q.id];
      return `<div class="row"><div class="t">${q.n}<small>${v}/${q.goal} · 💎 ${q.gem}</small><div class="bar"><i style="width:${v / q.goal * 100}%"></i></div></div><button class="sbtn" data-q="${q.id}" ${done && !got ? '' : 'disabled'}>${got ? '완료' : done ? '받기' : '진행중'}</button></div>`; }).join('');
    $('qList').querySelectorAll('button[data-q]').forEach(b => b.onclick = () => { const q = QUESTS.find(x => x.id === b.dataset.q); if (M.qc[q.id] || (M.q[q.id] || 0) < q.goal) return; M.qc[q.id] = 1; M.gem += q.gem; save(); toast(`💎 +${q.gem}`); renderHome(); });
    // modes
    $('modes').innerHTML = MODES.map((m, k) => `<button data-m="${k}" class="${M.mode === k ? 'on' : ''}" style="color:${modeOpen(k) ? m.c : '#666'}">${modeOpen(k) ? '' : '🔒'}${m.n}<small>${modeOpen(k) ? `보상 x${m.rw} · 최고 ${M.bm[k] || 0}` : `${MODES[k - 1].n} 20웨이브`}</small></button>`).join('');
    $('modes').querySelectorAll('button').forEach(b => b.onclick = () => { const k = +b.dataset.m; if (!modeOpen(k)){ toast(`${MODES[k - 1].n} 모드 20웨이브를 넘기면 열려요`); return; } M.mode = k; save(); renderHome(); });
    dayRoll(); const tk = M.tk || {};
    $('xmodes').innerHTML = [['hunt', '🏹 사냥', '3분 동안 많이 잡기', '#8cf08c', M.hb], ['raid', '👹 보스 레이드', '보스만 연속 등장', '#ff7a7a', M.rb]].map(([k, n, d, c, b]) => `<button data-x="${k}" style="color:${c}">${n} ${3 - (tk[k] || 0)}/3<small>${d} · 최고 ${b || 0}</small></button>`).join('');
    $('xmodes').querySelectorAll('button').forEach(b => b.onclick = () => { const k = b.dataset.x; M.tk = M.tk || {}; if ((M.tk[k] || 0) >= 3){ toast('오늘 입장권을 다 썼어요 (내일 충전)'); return; } M.tk[k] = (M.tk[k] || 0) + 1; save(); startGame(k); });
    // treasures
    $('trGrid').innerHTML = TREAS.map(t => { const lv = TL(t.id); return `<div class="tc ${lv ? '' : 'lock'}"><div class="e">${t.e}</div><div class="n">${t.n} ${lv ? 'Lv.' + lv : ''}</div><div class="d">${t.d(Math.max(1, lv))}</div></div>`; }).join('');
    { const pool = TREAS.filter(t => TL(t.id) < TR_MAX); $('trOdds').innerHTML = pool.length ? `획득 확률: 최대 레벨이 아닌 보물 ${pool.length}종 중 균등 · 각 ${(100 / pool.length).toFixed(2)}% · <a href="prob.html" target="_blank" style="color:#9a92c0">확률 정보</a>` : '모든 보물이 최대 레벨이에요'; }
    $('bTr').disabled = M.gem < TR_COST; $('bTr10').disabled = M.gem < 270;
    $('dTreas').style.display = M.gem >= TR_COST ? 'block' : 'none';
    // dots
    $('dShop').style.display = freeOk || (passOn() && M.passGem !== today()) ? 'block' : 'none'; $('dQuest').style.display = attOk || QUESTS.some(q => (M.q[q.id] || 0) >= q.goal && !M.qc[q.id]) ? 'block' : 'none';
    $('dUnits').style.display = UNITS.some(u => M.seen[u.id] && M.gold >= upCost(u)) ? 'block' : 'none';
  }
  function pullTr(n, cost){ if (M.gem < cost) return; const pool = TREAS.filter(t => TL(t.id) < TR_MAX); if (!pool.length){ toast('모든 보물이 최대 레벨이에요!'); return; }
    M.gem -= cost; const got = {}; for (let i = 0; i < n; i++){ const p2 = TREAS.filter(t => TL(t.id) < TR_MAX); if (!p2.length) break; const t = p2[Math.floor(Math.random() * p2.length)]; M.tr[t.id] = TL(t.id) + 1; got[t.n] = (got[t.n] || 0) + 1; }
    save(); SFX.epic(); toast(Object.entries(got).map(([k, v]) => `${k}${v > 1 ? ' x' + v : ''}`).join(', ')); renderHome(); }
  $('bTr').onclick = () => pullTr(1, TR_COST); $('bTr10').onclick = () => pullTr(10, 270);
  let quitT = 0; window.goHomeConfirm = function(){ if (G.over) return; if (performance.now() - quitT < 2000){ gameOver(); return; } quitT = performance.now(); float('한 번 더 누르면 포기하고 보상받기', LW / 2, 470, '#ffb0b0'); };
  if (!Object.keys(M.seen).length){ ['sword1', 'bow1', 'mage1'].forEach(id => M.seen[id] = 1); save(); }
  resize(); newGame(); renderHome(); requestAnimationFrame(frame);
  window.__G = () => G; window.__T = { summon, merge, gamble, makeMyth, recipeReady, place, UB };
})();
</script></body></html>
