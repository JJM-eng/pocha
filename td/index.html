<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>운빨 수호대: 랜덤 디펜스</title>
<style>
  html,body{margin:0;height:100%;background:#120f20;overflow:hidden;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto}
  canvas{display:block;width:100%;height:100%}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,6,16,.78)}
  .ov.hide{display:none}
  .box{background:#231e3a;border:2px solid #4a3f7a;border-radius:18px;padding:22px 20px;width:78%;text-align:center}
  .box h1{margin:0 0 6px;font-size:26px;color:#ffd447}
  .box p{margin:6px 0;color:#c8c0ea;font-size:14px;line-height:1.5}
  .btn{border:0;border-radius:14px;padding:14px 0;width:100%;font-size:18px;font-weight:900;background:linear-gradient(#ffe27a,#ffbe2e);color:#3a2206;box-shadow:0 4px 0 #a8741e;margin-top:12px}
  #home{position:absolute;inset:0;display:flex;flex-direction:column;background:#1b2a17 url(art/bg_field.webp) center/cover;overflow:hidden}
  #home.hide{display:none}
  #home:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,24,.55),rgba(10,8,24,.1) 35%,rgba(10,8,24,.25) 65%,rgba(10,8,24,.85))}
  .hbar{position:relative;display:flex;gap:6px;align-items:center;padding:12px 12px 0}
  .pill{background:rgba(10,8,24,.75);border:1.5px solid rgba(255,255,255,.15);border-radius:20px;padding:5px 12px;font-weight:900;font-size:14px;display:flex;align-items:center;gap:4px}
  .hpage{position:relative;flex:1;overflow-y:auto;padding:10px 14px;display:none}
  .hpage.on{display:flex;flex-direction:column}
  #pgBattle{align-items:center;justify-content:flex-end;padding-bottom:18px}
  .ttl{font-size:34px;font-weight:900;color:#ffd447;text-shadow:0 3px 0 #7a4a0e,0 0 18px rgba(255,200,60,.5);letter-spacing:1px;margin-top:6px;text-align:center}
  .sub{font-size:13px;color:#e8e0ff;text-align:center;text-shadow:0 1px 3px #000}
  .heroWrap{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:180px}
  .heroWrap img{height:min(36vh,260px);filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
  .heroWrap .glow{position:absolute;bottom:0;width:200px;height:46px;border-radius:50%;background:radial-gradient(rgba(255,120,160,.75),transparent 70%);animation:pulse 2s infinite}
  .side{position:absolute;bottom:10px;height:min(20vh,150px)!important;opacity:.95}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
  .bigbtn{border:0;border-radius:20px;padding:16px 0;width:84%;font-size:24px;font-weight:900;background:linear-gradient(#ffe27a,#ffb21e);color:#3a2206;box-shadow:0 6px 0 #a8641e,0 0 24px rgba(255,200,60,.5);margin-top:14px;animation:pulse 1.6s infinite}
  .bigbtn small{display:block;font-size:12px;font-weight:800;opacity:.75}
  .tabs{position:relative;display:flex;background:rgba(10,8,24,.92);border-top:1.5px solid rgba(255,255,255,.1);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;background:none;border:0;color:#9a92c0;font-weight:800;font-size:11px;padding:8px 0 10px;position:relative}
  .tabs button b{display:block;font-size:22px;margin-bottom:2px;filter:grayscale(.6)}
  .tabs button.on{color:#ffd447;background:linear-gradient(rgba(255,212,71,.15),transparent)}
  .tabs button.on b{filter:none;transform:scale(1.15)}
  .dot{position:absolute;top:6px;right:22%;width:9px;height:9px;border-radius:50%;background:#ff4a5a;display:none}
  .card{background:rgba(24,20,44,.92);border:1.5px solid rgba(255,255,255,.1);border-radius:16px;padding:12px;margin-bottom:10px}
  .card h3{margin:0 0 8px;font-size:16px;color:#ffd447}
  .ugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .uc{border-radius:14px;padding:6px 4px 8px;text-align:center;position:relative;border:2px solid}
  .uc img{height:62px;display:block;margin:0 auto}
  .uc .nm{font-size:11px;font-weight:900;margin-top:2px}
  .uc .lv{position:absolute;top:4px;left:6px;font-size:10px;font-weight:900;background:rgba(0,0,0,.55);border-radius:8px;padding:1px 5px}
  .uc button{margin-top:4px;border:0;border-radius:9px;padding:4px 0;width:92%;font-weight:900;font-size:11px;background:#ffd447;color:#3a2206}
  .uc button:disabled{background:#4a4466;color:#888}
  .uc.lock img{filter:brightness(0) opacity(.55)}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .row:last-child{border:0}
  .row .t{flex:1;font-size:13px;font-weight:700}
  .row .t small{display:block;color:#9a92c0;font-weight:600}
  .sbtn{border:0;border-radius:10px;padding:8px 12px;font-weight:900;font-size:12px;background:linear-gradient(#8cf08c,#3cb84c);color:#06260c;min-width:74px}
  .sbtn:disabled{background:#3a3456;color:#777}
  .bar{height:6px;background:#0008;border-radius:3px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:#ffd447}
  .reward{font-size:15px;color:#ffd447;font-weight:900;margin:8px 0}
  .btn2{border:0;border-radius:14px;padding:12px 0;width:100%;font-size:16px;font-weight:900;background:#3a3456;color:#e8e0ff;margin-top:8px}
  #toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(10,8,24,.9);border:1.5px solid #ffd447;color:#ffd447;font-weight:900;padding:10px 18px;border-radius:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;white-space:nowrap}
  #exitBtn{position:absolute;left:10px;bottom:10px;display:none}
</style></head><body><div id="wrap">
<canvas id="c"></canvas>
<div id="home">
  <div class="hbar"><div class="pill">🪙 <span id="hGold">0</span></div><div class="pill">💎 <span id="hGem">0</span></div><div style="flex:1"></div><div class="pill" id="hBest">🏆 0</div></div>
  <div class="hpage on" id="pgBattle">
    <div class="ttl">운빨 수호대</div><div class="sub">랜덤 소환 · 합성 · 신화 조합 디펜스</div>
    <div class="heroWrap"><div class="glow"></div><img class="side" id="hSideL" style="left:6%" alt=""><img id="hHero" alt=""><img class="side" id="hSideR" style="right:6%" alt=""></div>
    <button class="bigbtn" id="go">⚔️ 전투 시작<small id="hTip">몬스터 100마리가 넘으면 패배!</small></button>
  </div>
  <div class="hpage" id="pgUnits"><div class="card"><h3>수호자 강화</h3><div class="sub" style="text-align:left;margin-bottom:8px">골드로 영구 강화 · 레벨당 공격력 +12%</div><div class="ugrid" id="uGrid"></div></div>
    <div class="card"><h3>✨ 신화 조합식</h3><div id="recList"></div></div></div>
  <div class="hpage" id="pgShop"><div class="card"><h3>무료 보급</h3><div id="shopFree"></div></div><div class="card"><h3>보석 교환</h3><div id="shopGem"></div></div></div>
  <div class="hpage" id="pgQuest"><div class="card"><h3>📅 출석</h3><div id="attList"></div></div><div class="card"><h3>오늘의 퀘스트</h3><div id="qList"></div></div></div>
  <div class="tabs"><button data-p="pgShop"><b>🛒</b>상점<i class="dot" id="dShop"></i></button><button data-p="pgUnits"><b>🧙</b>수호자<i class="dot" id="dUnits"></i></button><button data-p="pgBattle" class="on"><b>⚔️</b>전투</button><button data-p="pgQuest"><b>📜</b>퀘스트<i class="dot" id="dQuest"></i></button></div>
</div>
<div id="toast"></div>
<div id="over" class="ov hide"><div class="box">
  <h1 id="ovT">패배...</h1>
  <p id="ovS"></p>
  <div class="reward" id="ovR"></div>
  <button class="btn" id="again">다시 하기</button>
  <button class="btn2" id="toHome">🏠 홈으로</button>
</div></div>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const LW = 360, LH = 640; let K = 1;
  function resize(){ const r = cv.getBoundingClientRect(), d = Math.min(2.5, window.devicePixelRatio || 1); cv.width = r.width * d; cv.height = r.height * d; K = cv.width / LW; }
  addEventListener('resize', resize);

  // ---------- art ----------
  const ART = {}, MOBS = ['slime','goblin','wolf','mushroom','scorpion','mummy','yeti','icebat','imp','lavaslime','skeleton','darkknight'];
  const BOSSES = ['kingslime','treant','sandworm','frostgolem','firedrake','demonlord'];
  [...MOBS.map(m => 'mob_' + m), ...BOSSES.map(b => 'boss_' + b), 'bg_1', 'bg_field', 'tex_road', 'tile_slot'].forEach(n => { const im = new Image(); im.onload = () => ART[n] = im; im.src = 'art/' + n + '.webp'; });

  const WH = new Map(); function whiteOf(im){ let c = WH.get(im); if (c) return c; c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); WH.set(im, c); return c; }
  // ---------- board ----------
  const COLS = 6, ROWS = 3, CELL = 50, GX = (LW - COLS * CELL) / 2, GY = 250;
  const PAD = 26;                                   // path ring distance from grid
  const P = { x0: GX - PAD, y0: GY - PAD, x1: GX + COLS * CELL + PAD, y1: GY + ROWS * CELL + PAD };
  const PW = P.x1 - P.x0, PH = P.y1 - P.y0, PLEN = 2 * (PW + PH);
  function pathPos(d){ d = ((d % PLEN) + PLEN) % PLEN;
    if (d < PW) return [P.x0 + d, P.y0]; d -= PW;
    if (d < PH) return [P.x1, P.y0 + d]; d -= PH;
    if (d < PW) return [P.x1 - d, P.y1]; d -= PW;
    return [P.x0, P.y1 - d]; }
  const cellXY = i => [GX + (i % COLS) * CELL + CELL / 2, GY + Math.floor(i / COLS) * CELL + CELL / 2];

  // ---------- units ----------
  const RAR = [
    { n: '일반', c: '#b8c0cc', g: '#6a7280' },
    { n: '희귀', c: '#5cc8ff', g: '#1f6aa8' },
    { n: '영웅', c: '#c08cff', g: '#6a34b0' },
    { n: '전설', c: '#ffd447', g: '#b07a10' },
    { n: '신화', c: '#ff6a8a', g: '#b0203e' },
  ];
  // kind: melee(short range fast), arrow(long range), magic(splash), slow, chain, multi
  const UNITS = [
    { id:'sword1', r:0, name:'견습 검사',   e:'🗡️', kind:'melee', dmg:14, spd:1.4, rng:62 },
    { id:'bow1',   r:0, name:'견습 궁수',   e:'🏹', kind:'arrow', dmg:9,  spd:1.1, rng:150 },
    { id:'mage1',  r:0, name:'견습 마법사', e:'🔮', kind:'magic', dmg:7,  spd:0.8, rng:120, aoe:26 },
    { id:'sword2', r:1, name:'기사',        e:'⚔️', kind:'melee', dmg:42, spd:1.5, rng:66 },
    { id:'bow2',   r:1, name:'사냥꾼',      e:'🎯', kind:'arrow', dmg:28, spd:1.2, rng:160 },
    { id:'ice2',   r:1, name:'얼음술사',    e:'❄️', kind:'slow',  dmg:16, spd:0.9, rng:130, aoe:30, slow:0.4 },
    { id:'sword3', r:2, name:'성기사',      e:'🛡️', kind:'melee', dmg:130,spd:1.6, rng:70 },
    { id:'bow3',   r:2, name:'저격수',      e:'🔭', kind:'arrow', dmg:120,spd:0.7, rng:240 },
    { id:'fire3',  r:2, name:'화염술사',    e:'🔥', kind:'magic', dmg:60, spd:0.9, rng:140, aoe:36 },
    { id:'sword4', r:3, name:'검성',        e:'🌀', kind:'melee', dmg:420,spd:1.8, rng:76 },
    { id:'bow4',   r:3, name:'바람 궁수',   e:'🍃', kind:'multi', dmg:190,spd:1.2, rng:180, n:3 },
    { id:'bolt4',  r:3, name:'번개 마도사', e:'⚡', kind:'chain', dmg:230,spd:1.0, rng:160, n:4 },
    { id:'drag5',  r:4, name:'용기사',      e:'🐉', kind:'magic', dmg:1300,spd:1.3,rng:120, aoe:40 },
    { id:'star5',  r:4, name:'천궁',        e:'🌟', kind:'multi', dmg:700,spd:1.6, rng:260, n:5 },
    { id:'arch5',  r:4, name:'대마법사',    e:'☄️', kind:'chain', dmg:900,spd:1.1, rng:220, n:6, slow:0.3 },
  ];
  const byRar = r => UNITS.filter(u => u.r === r);
  // ---------- meta (save) ----------
  const SKEY = 'luckdef_v1', today = () => new Date().toISOString().slice(0, 10);
  let M = { gold: 300, gem: 30, best: 0, lv: {}, seen: {}, day: '', q: {}, qc: {}, att: 0, attDay: '', free: '', games: 0 };
  try { Object.assign(M, JSON.parse(localStorage.getItem(SKEY) || '{}')); } catch(e){}
  const save = () => { try { localStorage.setItem(SKEY, JSON.stringify(M)); } catch(e){} };
  function dayRoll(){ if (M.day !== today()){ M.day = today(); M.q = {}; M.qc = {}; save(); } }
  const upMul = id => 1 + 0.12 * (M.lv[id] || 0);
  const upCost = u => Math.floor([40, 120, 360, 900, 2400][u.r] * Math.pow(1.35, M.lv[u.id] || 0));
  const QUESTS = [ { id: 'play', n: '전투 3판 하기', goal: 3, gem: 10 }, { id: 'summon', n: '수호자 60번 소환', goal: 60, gem: 10 }, { id: 'wave', n: '한 판에 15웨이브 도달', goal: 15, gem: 15, max: true }, { id: 'myth', n: '신화 수호자 만들기', goal: 1, gem: 20 }, { id: 'boss', n: '보스 3마리 처치', goal: 3, gem: 15 } ];
  function qAdd(id, v = 1, max = false){ dayRoll(); M.q[id] = max ? Math.max(M.q[id] || 0, v) : (M.q[id] || 0) + v; }
  const ATT = [100, 300, 10, 500, 20, 800, 50];   // 1,2,4,6 = gold; 3,5,7 = gems

  const UB = id => UNITS.find(u => u.id === id);
  UNITS.forEach(u => { const im = new Image(); im.onload = () => ART['u_' + u.id] = im; im.src = 'art/u_' + u.id + '.webp'; });
  const RECIPES = [
    { out: 'drag5', need: ['sword4', 'sword3', 'fire3'] },
    { out: 'star5', need: ['bow4', 'bow3', 'bow2'] },
    { out: 'arch5', need: ['bolt4', 'fire3', 'ice2'] },
  ];
  let AC = null; const beep = (f, d = 0.08, type = 'square', v = 0.05, slide = 0) => { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), AC.currentTime + d); g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d); } catch(e){} };
  const SFX = { summon: () => beep(520, .08, 'triangle', .06, 300), rare: () => { beep(660, .12, 'triangle', .07); setTimeout(() => beep(990, .16, 'triangle', .07), 90); },
    epic: () => { [660, 880, 1320].forEach((f, i) => setTimeout(() => beep(f, .18, 'triangle', .08), i * 90)); }, fail: () => beep(220, .25, 'sawtooth', .05, -120),
    merge: () => beep(440, .12, 'sine', .08, 600), boss: () => beep(110, .5, 'sawtooth', .08, -40), myth: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, .22, 'triangle', .09), i * 80)); } };
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // ---------- state ----------
  let G;
  function newGame(){
    G = { dead: [], shake: 0, t: 0, wave: 0, waveT: 3, spawnLeft: 0, spawnT: 0, silver: 120, cost: 20, luck: 0, speed: 1, flash: 0, flashC: '255,255,255', grid: Array(COLS * ROWS).fill(null),
          mobs: [], shots: [], fx: [], texts: [], over: false, kills: 0, bossAlive: null, drag: null, sel: -1 };
  }
  const CAP = 100;
  const mobHp = w => Math.floor(30 * Math.pow(1.2, w - 1) * (1 + w * 0.05));
  const WAVE_N = w => 18 + Math.floor(w * 1.2);

  function startWave(){
    G.wave++; G.waveT = G.wave % 10 === 0 ? 45 : 20; if (G.wave > 1) G.luck += 1;
    if (G.wave % 10 === 0){
      const b = BOSSES[(G.wave / 10 - 1) % BOSSES.length], hp = mobHp(G.wave) * 28; SFX.boss();
      const m = { d: 0, hp, max: hp, spd: 22, boss: true, type: b, slowT: 0, hit: 0, id: Math.random() };
      G.mobs.push(m); G.bossAlive = m; G.spawnLeft = 0;
      banner(`BOSS ${G.wave}웨이브`, '#ff5a5a');
    } else {
      G.spawnLeft = WAVE_N(G.wave); G.spawnT = 0;
      banner(`${G.wave} 웨이브`, '#ffd447');
    }
  }
  function spawnMob(){
    const type = MOBS[Math.floor((G.wave - 1) / 3) % MOBS.length], hp = mobHp(G.wave);
    G.mobs.push({ d: 0, hp, max: hp, spd: 34 + Math.min(30, G.wave * 0.6), type, slowT: 0, hit: 0, id: Math.random() });
  }

  function summon(){
    if (G.over || G.silver < G.cost) return;
    const free = G.grid.map((u, i) => u ? -1 : i).filter(i => i >= 0); if (!free.length){ float('칸이 가득 찼어요', LW/2, GY - 40, '#ff9a9a'); return; }
    G.silver -= G.cost; G.cost += 1; qAdd('summon');
    const roll = Math.random(), r = roll < 0.01 ? 2 : roll < 0.13 ? 1 : 0;   // 1% 영웅, 12% 희귀
    place(pick(free), pick(byRar(r)));
  }
  function merge(a, b){
    const A = G.grid[a], B = G.grid[b];
    if (!A || !B || a === b || A.u.id !== B.u.id || A.u.r >= 3) return false;
    G.grid[a] = null; place(b, pick(byRar(A.u.r + 1))); SFX.merge();
    return true;
  }
  function sell(i){ const s = G.grid[i]; if (!s) return; G.silver += [10, 30, 90, 270, 800][s.u.r]; G.grid[i] = null; }

  // ---------- combat ----------
  const mobXY = m => pathPos(m.d);
  function inRange(x, y, rng){ return G.mobs.filter(m => { const [mx, my] = mobXY(m); return (mx - x) ** 2 + (my - y) ** 2 <= rng * rng; }); }
  function front(list){ return list.sort((a, b) => b.d - a.d); }
  function place(i, u){ G.grid[i] = { u, cd: 0.3, pop: 1 }; if (!M.seen[u.id]){ M.seen[u.id] = 1; } if (u.r === 4) qAdd('myth'); const [x, y] = cellXY(i), r = u.r; burst(x, y, RAR[r].c, [8, 18, 30, 44, 60][r]);
    if (r >= 1) float(RAR[r].n + '!', x, y - 26, RAR[r].c);
    if (r >= 2){ G.flash = r >= 3 ? 0.6 : 0.35; G.flashC = r >= 4 ? '255,120,150' : r >= 3 ? '255,220,90' : '200,150,255'; }
    if (r >= 3) banner(RAR[r].n + ' ' + u.name + '!', RAR[r].c);
    (r >= 4 ? SFX.myth : r >= 2 ? SFX.epic : r === 1 ? SFX.rare : SFX.summon)(); }
  const GAMBLE = [ { r: 1, p: 0.6, cost: 1 }, { r: 2, p: 0.2, cost: 1 }, { r: 3, p: 0.1, cost: 2 } ];
  function gamble(k){ const g = GAMBLE[k]; if (G.over || G.luck < g.cost) return; const free = G.grid.map((u, i) => u ? -1 : i).filter(i => i >= 0); if (!free.length){ float('칸이 가득 찼어요', LW/2, GY - 40, '#ff9a9a'); return; }
    G.luck -= g.cost; if (Math.random() < g.p) place(pick(free), pick(byRar(g.r))); else { float('꽝...', LW / 2, 470, '#9a92c0'); SFX.fail(); } }
  function recipeReady(){ return RECIPES.find(rc => rc.need.every(id => G.grid.some(s => s && s.u.id === id))); }

    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(lx * 0.5, 15, 13, 4, 0, 0, 6.28); ctx.fill();
    if (s.u.r >= 3){ for (let q = 0; q < 2; q++){ const t = (G.t * 0.8 + q * 0.5 + x * 0.01) % 1; ctx.globalAlpha = 1 - t; ctx.fillStyle = R.c; ctx.beginPath(); ctx.arc(Math.sin(t * 9 + q * 3) * 12, 12 - t * 34, 1.6, 0, 6.28); ctx.fill(); } ctx.globalAlpha = 1; }
    const im = ART['u_' + s.u.id];
    if (im){ const h = 42 + s.u.r * 1.5, w = h * im.width / im.height;
      ctx.save(); ctx.translate(lx, 16 + ly); ctx.scale((s.face || 1) * sqx, sqy); ctx.drawImage(im, -w / 2, -h, w, h);
      if (s.pop > 0){ ctx.globalAlpha = s.pop; ctx.drawImage(whiteOf(im), -w / 2, -h, w, h); ctx.globalAlpha = 1; }
      ctx.restore(); }
    else { ctx.fillStyle = R.c; ctx.beginPath(); ctx.arc(0, 0, 19, 0, 6.28); ctx.fill(); ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s.u.e, 0, 1); ctx.textBaseline = 'alphabetic'; }
    if (canMerge){ ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]); ctx.lineDashOffset = -G.t * 10; ctx.beginPath(); ctx.ellipse(0, 14, 21, 7, 0, 0, 6.28); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#fff'; ctx.font = '900 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('▲', 15, -24 + Math.sin(G.t * 5) * 2); }
    ctx.restore();
  }
  let btns = [];
  function drawHud(){
    btns = [];
    // top bar
    ctx.fillStyle = 'rgba(10,8,24,.8)'; rr(10, 12, LW - 20, 64, 14); ctx.fill();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#ffd447'; ctx.font = '900 20px sans-serif'; ctx.fillText(`${G.wave} 웨이브`, 24, 40);
    ctx.fillStyle = '#c8c0ea'; ctx.font = '700 12px sans-serif'; ctx.fillText(G.wave ? `다음 웨이브 ${Math.ceil(G.waveT)}초` : `${Math.ceil(G.waveT)}초 뒤 시작`, 24, 60);
    const n = G.mobs.length, frac = Math.min(1, n / CAP);
    ctx.textAlign = 'right'; ctx.fillStyle = frac > 0.8 ? '#ff6a6a' : '#fff'; ctx.font = '900 18px sans-serif'; ctx.fillText(`👾 ${n}/${CAP}`, LW - 24, 40);
    ctx.fillStyle = '#000a'; rr(LW - 134, 50, 110, 8, 4); ctx.fill(); ctx.fillStyle = frac > 0.8 ? '#ff4a4a' : frac > 0.5 ? '#ffb347' : '#6ee07a'; rr(LW - 134, 50, 110 * frac, 8, 4); ctx.fill();
    if (G.bossAlive){ const b = G.bossAlive; ctx.fillStyle = 'rgba(10,8,24,.8)'; rr(40, 84, LW - 80, 22, 11); ctx.fill(); ctx.fillStyle = '#ff5a5a'; rr(44, 88, (LW - 88) * Math.max(0, b.hp / b.max), 14, 7); ctx.fill();
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '800 11px sans-serif'; ctx.fillText(`보스 · 남은 시간 ${Math.ceil(G.waveT)}초`, LW / 2, 99); }
    // bottom panel
    const by = 520; ctx.fillStyle = 'rgba(10,8,24,.85)'; rr(10, by, LW - 20, 108, 16); ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = '#e8e8f0'; ctx.font = '900 18px sans-serif'; ctx.fillText(`🪙 ${G.silver}`, 26, by + 30);
    ctx.fillStyle = '#8cf08c'; ctx.font = '900 15px sans-serif'; ctx.fillText(`🍀 ${G.luck}`, 120, by + 30);
    GAMBLE.forEach((g, k) => { const ok = G.luck >= g.cost; btn(26 + k * 60, by + 40, 54, 32, ok ? [RAR[g.r].c, RAR[g.r].g] : ['#3a3450', '#2a2440'], () => gamble(k), [RAR[g.r].n, `${Math.round(g.p * 100)}% 🍀${g.cost}`], ok ? '#111' : '#777', 12, 9); });
    const can = G.silver >= G.cost && G.grid.some(s => !s);
    btn(LW - 150, by + 14, 126, 80, can ? ['#ffe27a', '#ffbe2e'] : ['#5a5470', '#3a3450'], () => summon(), [`소환`, `🪙 ${G.cost}`], can ? '#3a2206' : '#aaa');
    // trash
    ctx.fillStyle = G.drag ? 'rgba(255,80,80,.35)' : 'rgba(255,255,255,.06)'; rr(26, by + 78, 110, 24, 8); ctx.fill(); ctx.fillStyle = '#ffb0b0'; ctx.font = '800 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🗑️ 판매', 81, by + 95);
    btn(142, by + 78, 44, 24, ['#2a2446', '#2a2446'], () => { G.speed = G.speed === 1 ? 2 : 1; }, [`▶x${G.speed}`, ''], '#ffd447', 12, 0);
    const rc = recipeReady(); if (rc){ const pulse = 0.5 + 0.5 * Math.sin(G.t * 6); btn(LW / 2 - 80, 446, 160, 40, ['#ff9ab0', '#e0405e'], makeMyth, ['✨ 신화 조합 ✨', UB(rc.out).name], '#fff', 15, 11); ctx.strokeStyle = `rgba(255,255,255,${pulse})`; ctx.lineWidth = 2; rr(LW / 2 - 80, 446, 160, 40, 14); ctx.stroke(); }
    if (G.flash > 0){ ctx.fillStyle = `rgba(${G.flashC},${G.flash * 0.5})`; ctx.fillRect(0, 0, LW, LH); }
    if (bannerS){ const a = Math.min(1, bannerS.t * 2); ctx.globalAlpha = a; ctx.font = '900 30px sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(bannerS.s, LW / 2, 200); ctx.fillStyle = bannerS.c; ctx.fillText(bannerS.s, LW / 2, 200); ctx.globalAlpha = 1; }
  }
  function btn(x, y, w, h, cols, fn, lines, tc, f1 = 22, f2 = 14){ const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]); ctx.fillStyle = g; rr(x, y, w, h, Math.min(14, h / 2.5)); ctx.fill();
    ctx.fillStyle = tc; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.font = `900 ${f1}px sans-serif`;
    if (lines[1]){ ctx.fillText(lines[0], x + w / 2, y + h / 2 - f2 * 0.1); ctx.font = `800 ${f2}px sans-serif`; ctx.fillText(lines[1], x + w / 2, y + h / 2 + f2 * 1.2); } else ctx.fillText(lines[0], x + w / 2, y + h / 2 + f1 * 0.35);
    btns.push({ x, y, w, h, fn }); }

  // ---------- input ----------
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * LW, (e.clientY - r.top) / r.height * LH]; };
  const cellAt = (x, y) => { const c = Math.floor((x - GX) / CELL), r = Math.floor((y - GY) / CELL); return c >= 0 && c < COLS && r >= 0 && r < ROWS ? r * COLS + c : -1; };
  cv.addEventListener('pointerdown', e => { if (!G || G.over) return; const [x, y] = pt(e);
    for (const b of btns) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){ b.fn(); return; }
    const i = cellAt(x, y); if (i >= 0 && G.grid[i]){ G.drag = { i, x, y, sx: x, sy: y }; cv.setPointerCapture(e.pointerId); } });
  cv.addEventListener('pointermove', e => { if (G && G.drag){ const [x, y] = pt(e); G.drag.x = x; G.drag.y = y; } });
  cv.addEventListener('pointerup', e => { if (!G || !G.drag) return; const [x, y] = pt(e), d = G.drag; G.drag = null;
    if (y > 590 && x < 140){ sell(d.i); return; }
    const j = cellAt(x, y); if (j < 0 || j === d.i) return;
    if (!merge(d.i, j)){ const t = G.grid[j]; G.grid[j] = G.grid[d.i]; G.grid[d.i] = t; } });

  // ---------- boot ----------
  let last = performance.now();
  function frame(now){ const dt = Math.min(0.05, (now - last) / 1000); last = now; if (G && running){ for (let k = 0; k < G.speed; k++) update(dt); } if (G) draw(); requestAnimationFrame(frame); }
  let running = false;
  const $ = id => document.getElementById(id), home = $('home');
  function toast(t){ const e = $('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.opacity = 0, 1400); }
  function startGame(){ home.classList.add('hide'); $('over').classList.add('hide'); newGame(); running = true; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch(e){} }
  function goHome(){ running = false; $('over').classList.add('hide'); home.classList.remove('hide'); renderHome(); }
  $('go').onclick = startGame; $('again').onclick = startGame; $('toHome').onclick = goHome;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); document.querySelectorAll('.hpage').forEach(p => p.classList.toggle('on', p.id === b.dataset.p)); renderHome(); });
  const uimg = id => `art/u_${id}.webp`;
  function renderHome(){ dayRoll();
    $('hGold').textContent = M.gold.toLocaleString(); $('hGem').textContent = M.gem; $('hBest').textContent = '🏆 ' + M.best + '웨이브';
    const top = [...UNITS].filter(u => M.seen[u.id]).sort((a, b) => b.r - a.r || (M.lv[b.id] || 0) - (M.lv[a.id] || 0));
    const hero = top[0] || UB('drag5'), sides = top.filter(u => u !== hero).slice(0, 2); $('hHero').src = uimg(hero.id);
    $('hSideL').src = uimg((sides[0] || UB('sword1')).id); $('hSideR').src = uimg((sides[1] || UB('mage1')).id);
    $('hTip').textContent = M.best ? `최고 ${M.best}웨이브 · 판이 끝나면 골드 획득` : '몬스터 100마리가 넘으면 패배!';
    // units
    $('uGrid').innerHTML = UNITS.map(u => { const R = RAR[u.r], lv = M.lv[u.id] || 0, c = upCost(u), lock = !M.seen[u.id];
      return `<div class="uc ${lock ? 'lock' : ''}" style="border-color:${R.c};background:linear-gradient(${R.g}55,#14102a)"><span class="lv">Lv.${lv + 1}</span><img src="${uimg(u.id)}"><div class="nm" style="color:${R.c}">${lock ? '???' : u.name}</div>
        <button data-u="${u.id}" ${lock || M.gold < c ? 'disabled' : ''}>${lock ? '미발견' : '🪙 ' + c.toLocaleString()}</button></div>`; }).join('');
    $('uGrid').querySelectorAll('button[data-u]').forEach(b => b.onclick = () => { const u = UB(b.dataset.u), c = upCost(u); if (M.gold < c) return; M.gold -= c; M.lv[u.id] = (M.lv[u.id] || 0) + 1; save(); SFX.merge(); toast(`${u.name} Lv.${M.lv[u.id] + 1}!`); renderHome(); });
    $('recList').innerHTML = RECIPES.map(rc => `<div class="row"><img src="${uimg(rc.out)}" style="height:44px"><div class="t" style="color:#ff8aa8">${UB(rc.out).name}<small>${rc.need.map(id => UB(id).name).join(' + ')}</small></div></div>`).join('');
    // shop
    const freeOk = M.free !== today();
    $('shopFree').innerHTML = `<div class="row"><div style="font-size:30px">🎁</div><div class="t">매일 무료 보급<small>골드 300 + 보석 5</small></div><button class="sbtn" id="bFree" ${freeOk ? '' : 'disabled'}>${freeOk ? '받기' : '내일 다시'}</button></div>`;
    $('bFree').onclick = () => { if (M.free === today()) return; M.free = today(); M.gold += 300; M.gem += 5; save(); toast('🪙 +300  💎 +5'); renderHome(); };
    const GX2 = [ [20, 600], [60, 2000], [150, 5500] ];
    $('shopGem').innerHTML = GX2.map(([g, o], k) => `<div class="row"><div style="font-size:26px">${['💰', '💰💰', '🏦'][k]}</div><div class="t">골드 ${o.toLocaleString()}<small>보석 ${g}개</small></div><button class="sbtn" data-k="${k}" ${M.gem < g ? 'disabled' : ''}>💎 ${g}</button></div>`).join('');
    $('shopGem').querySelectorAll('button').forEach(b => b.onclick = () => { const [g, o] = GX2[+b.dataset.k]; if (M.gem < g) return; M.gem -= g; M.gold += o; save(); toast(`🪙 +${o}`); renderHome(); });
    // attendance
    const attOk = M.attDay !== today(), di = M.att % 7;
    $('attList').innerHTML = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${ATT.map((v, k) => `<div style="text-align:center;border-radius:10px;padding:6px 0;font-size:11px;font-weight:900;background:${k < di ? '#2c5a34' : k === di && attOk ? '#7a5a10' : '#2a2446'};border:1.5px solid ${k === di && attOk ? '#ffd447' : 'transparent'}">${k + 1}일<br>${[2, 4, 6].includes(k) ? '💎' : '🪙'}<br>${v}</div>`).join('')}</div>
      <button class="sbtn" id="bAtt" style="width:100%;margin-top:8px" ${attOk ? '' : 'disabled'}>${attOk ? '출석 보상 받기' : '오늘 출석 완료'}</button>`;
    $('bAtt').onclick = () => { if (M.attDay === today()) return; const v = ATT[M.att % 7]; if ([2, 4, 6].includes(M.att % 7)) M.gem += v; else M.gold += v; M.att++; M.attDay = today(); save(); toast('출석 보상 받았어요!'); renderHome(); };
    // quests
    $('qList').innerHTML = QUESTS.map(q => { const v = Math.min(q.goal, M.q[q.id] || 0), done = v >= q.goal, got = M.qc[q.id];
      return `<div class="row"><div class="t">${q.n}<small>${v}/${q.goal} · 💎 ${q.gem}</small><div class="bar"><i style="width:${v / q.goal * 100}%"></i></div></div><button class="sbtn" data-q="${q.id}" ${done && !got ? '' : 'disabled'}>${got ? '완료' : done ? '받기' : '진행중'}</button></div>`; }).join('');
    $('qList').querySelectorAll('button[data-q]').forEach(b => b.onclick = () => { const q = QUESTS.find(x => x.id === b.dataset.q); if (M.qc[q.id] || (M.q[q.id] || 0) < q.goal) return; M.qc[q.id] = 1; M.gem += q.gem; save(); toast(`💎 +${q.gem}`); renderHome(); });
    // dots
    $('dShop').style.display = freeOk ? 'block' : 'none'; $('dQuest').style.display = attOk || QUESTS.some(q => (M.q[q.id] || 0) >= q.goal && !M.qc[q.id]) ? 'block' : 'none';
    $('dUnits').style.display = UNITS.some(u => M.seen[u.id] && M.gold >= upCost(u)) ? 'block' : 'none';
  }
  if (!Object.keys(M.seen).length){ ['sword1', 'bow1', 'mage1'].forEach(id => M.seen[id] = 1); save(); }
  resize(); newGame(); renderHome(); requestAnimationFrame(frame);
  window.__G = () => G; window.__T = { summon, merge, gamble, makeMyth, recipeReady, place, UB };
})();
</script></body></html>
