<script type="module">
  window.__osdk = (async () => {
    try {
      const m = await Promise.race([import('https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js'), new Promise((_, r) => setTimeout(() => r('timeout'), 8000))]);
      const sdk = m.createSDK();
      sdk.on('pause', () => window.dispatchEvent(new Event('osdk-pause')));
      sdk.on('resume', () => window.dispatchEvent(new Event('osdk-resume')));
      try { sdk.setLoadingProgress(10); } catch (e) {}
      await sdk.initializeAsync();
      try { sdk.setLoadingProgress(100); } catch (e) {}
      try { await sdk.startGameAsync(); } catch (e) {}
      window.__osdkSdk = sdk; return sdk;
    } catch (e) { return null; }
  })();
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05060c;overflow:hidden;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#e8f4ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;width:640px;height:360px;transform-origin:0 0;overflow:hidden;background:#070a14}
#cv{position:absolute;left:0;top:0;width:640px;height:360px}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
button{font-family:inherit;cursor:pointer}
/* ---------- lobby ---------- */
#lobby{background:#0a1020 url(art/bg_lobby.webp) center/cover}
#lobby .tint{position:absolute;inset:0;pointer-events:none}
#lobbyChar{position:absolute;left:160px;top:-6px;height:380px;width:auto;filter:drop-shadow(0 0 18px rgba(60,220,255,.35));transition:transform .25s}
#lobbyChar.tap{transform:scale(1.03) translateY(-4px)}
.topbar{position:absolute;left:0;right:0;top:0;height:30px;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(rgba(4,8,18,.92),rgba(4,8,18,.0))}
.cur{display:flex;align-items:center;gap:4px;background:rgba(10,20,40,.8);border:1px solid #2a4a70;border-radius:12px;padding:2px 9px 2px 6px;font-size:11px;font-weight:800;white-space:nowrap}
.cur i{font-style:normal}
.lvl{font-size:11px;font-weight:900;color:#7fe7ff;margin-right:auto;display:flex;align-items:center;gap:6px}
.lvl b{background:linear-gradient(90deg,#26e0ff,#7a5cff);-webkit-background-clip:text;color:transparent;font-size:13px;letter-spacing:.5px}
.lcol{position:absolute;left:8px;top:38px;display:flex;flex-direction:column;gap:7px}
.lbtn{position:relative;width:62px;height:50px;border-radius:10px;border:1px solid #2c5a86;background:linear-gradient(160deg,rgba(18,40,70,.92),rgba(8,16,32,.92));color:#cfeaff;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:inset 0 0 10px rgba(40,200,255,.12)}
.lbtn .e{font-size:19px;line-height:1}
.dot{position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:#ff3b5c;border:2px solid #0a1020;display:none}
.dot.on{display:block}
.rcol{position:absolute;right:8px;top:36px;width:200px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rbtn{position:relative;height:56px;border-radius:12px;border:1px solid #2f6aa0;background:linear-gradient(160deg,rgba(16,44,80,.93),rgba(6,14,30,.93));color:#e9f6ff;font-size:12px;font-weight:900;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 10px;overflow:hidden;text-align:left}
.rbtn small{font-size:9px;color:#8fb6d8;font-weight:700}
.rbtn .e{position:absolute;right:6px;bottom:2px;font-size:26px;opacity:.85}
.rbtn.big{grid-column:span 2;height:74px;background:linear-gradient(120deg,rgba(255,60,110,.92),rgba(120,40,200,.92));border-color:#ff8ab0;font-size:17px}
.rbtn.big small{color:#ffe0ea;font-size:10px}
.rbtn.gacha{background:linear-gradient(120deg,rgba(30,200,255,.85),rgba(60,70,220,.9));border-color:#8ae8ff}
.rbtn.gacha small{color:#e0f6ff}
.charName{position:absolute;left:188px;bottom:10px;font-size:11px;font-weight:800;color:#bfe9ff;background:rgba(5,10,22,.7);border:1px solid #2a4a70;border-radius:10px;padding:3px 10px;max-width:260px}
.speech{position:absolute;left:300px;top:72px;max-width:170px;background:rgba(240,250,255,.95);color:#122;border-radius:12px;padding:7px 10px;font-size:11px;font-weight:700;line-height:1.35;display:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.speech.on{display:block;animation:pop .2s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.stam{position:absolute;left:8px;bottom:8px;font-size:10px;color:#9cc;background:rgba(5,10,22,.75);border-radius:8px;padding:3px 8px}
/* ---------- pages ---------- */
.page{background:linear-gradient(180deg,#0b1428,#060a16)}
.page .hd{position:absolute;left:0;right:0;top:0;height:34px;display:flex;align-items:center;gap:8px;padding:0 8px;background:rgba(4,8,18,.95);border-bottom:1px solid #1e3a5c;z-index:2}
.page .hd h2{margin:0;font-size:14px;font-weight:900;color:#9fe8ff;margin-right:auto;letter-spacing:.5px}
.back{width:30px;height:24px;border-radius:8px;border:1px solid #2c5a86;background:#0f2036;color:#bfe;font-size:14px;font-weight:900}
.body{position:absolute;left:0;right:0;top:34px;bottom:0;overflow-y:auto;overflow-x:hidden;padding:8px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.cta{border:0;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:900;color:#06121e;background:linear-gradient(#7ff2ff,#22b8ff);box-shadow:0 3px 0 #0b6fa8}
.cta.pink{background:linear-gradient(#ff9cc0,#ff3d7f);color:#fff;box-shadow:0 3px 0 #a3134a}
.cta.gold{background:linear-gradient(#ffe48a,#ffb422);color:#3a2206;box-shadow:0 3px 0 #a8741e}
.cta.gray,.cta:disabled{background:linear-gradient(#5a6578,#3b4558);color:#aab;box-shadow:0 3px 0 #252c3a}
.row{display:flex;align-items:center;gap:8px;background:rgba(14,28,50,.85);border:1px solid #1f3d62;border-radius:10px;padding:7px 9px;margin-bottom:6px}

.row .t small{display:block;color:#8fb2d2;font-size:10px;font-weight:600}
.sub{font-size:10px;color:#8fa6c4}

.agrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.acard{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:2px solid #334;background:#111827}
.acard img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.acard .nm{position:absolute;left:0;right:0;bottom:0;font-size:9px;font-weight:800;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.9));padding:8px 2px 2px}
.acard .rr{position:absolute;left:3px;top:2px;font-size:9px;font-weight:900;text-shadow:0 1px 2px #000}
.acard .lv{position:absolute;right:3px;top:2px;font-size:9px;font-weight:900;background:rgba(0,0,0,.6);border-radius:5px;padding:0 3px}

.acard.inp{outline:2px solid #ffd447;outline-offset:-2px}
.r-SSR{border-color:#ffcf4a!important;box-shadow:0 0 8px rgba(255,200,60,.45)}
.r-SR{border-color:#c07cff!important}
.r-R{border-color:#4ab8ff!important}
.r-N{border-color:#7b8796!important}
.c-SSR{color:#ffd44a}.c-SR{color:#d39bff}.c-R{color:#6cc6ff}.c-N{color:#aab4c0}.c-UR{color:#ff6b6b}
.portrait{width:100%;height:100%;object-fit:cover}
.nophoto{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;width:100%;height:100%}
/* party */

.pslot{flex:1;height:62px;border-radius:10px;border:2px dashed #2c5a86;background:rgba(14,28,50,.7);display:flex;align-items:center;gap:6px;padding:4px;font-size:11px;font-weight:800;overflow:hidden}
.pslot img{width:52px;height:52px;border-radius:8px;object-fit:cover}

.banner .bt{position:absolute;left:12px;top:12px;max-width:330px}

#dlg .who{font-size:13px;font-weight:900;color:#7fe7ff;margin-bottom:4px}

#rot{position:fixed;inset:0;display:none}
.chs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stg{position:relative;border-radius:10px;border:1px solid #2c5a86;background:rgba(14,28,50,.85);padding:8px;font-size:12px;font-weight:900;min-height:64px}

#loading{position:absolute;inset:0;z-index:30;background:#03050c url(art/key.webp) center/cover;display:flex;align-items:flex-end;justify-content:center}
#loading .lb{width:60%;margin-bottom:22px;text-align:center;font-size:11px;font-weight:800;color:#bfe9ff;text-shadow:0 1px 3px #000}
#loading .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
#loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#26e0ff,#ff3d7f);transition:width .2s}

</style></head>

<script>
'use strict';
// ====================================================================
//  CHRONOS LOST — web edition
// ====================================================================
const LW = 640, LH = 360;
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
let K = 1, MAT = new DOMMatrix(), INV = new DOMMatrix();
function fit(){
  const w = innerWidth, h = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  let s, m;
  if (w >= h){ s = Math.min(w / LW, h / LH); m = new DOMMatrix().translate((w - LW * s) / 2, (h - LH * s) / 2).scale(s); }
  else { s = Math.min(w / LH, h / LW); m = new DOMMatrix().translate((w - LH * s) / 2 + LH * s, (h - LW * s) / 2).rotate(90).scale(s); }
  MAT = m; INV = m.inverse();
  stage.style.transform = m.toString();
  const px = Math.min(1920, Math.round(LW * s * dpr));
  cv.width = px; cv.height = Math.round(px * LH / LW); K = cv.width / LW;

let AC = null, master = null, sfxG = null, bgmG = null, bgmLP = null;
function audio(){ if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
  sfxG = AC.createGain(); sfxG.gain.value = M.sfx ? .5 : 0; sfxG.connect(master); bgmG = AC.createGain(); bgmG.gain.value = M.bgm ? .22 : 0; bgmLP = AC.createBiquadFilter(); bgmLP.type = 'lowpass'; bgmLP.frequency.value = 20000; bgmG.connect(bgmLP); bgmLP.connect(master); noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = R() * 2 - 1; } catch(e){} }
let noiseBuf = null;
function tone(f, d, type, v, slide, g2){ if (!AC || !M.sfx) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + d);

function noise(d, v, hp, lp){ if (!AC || !M.sfx) return; if (!noiseBuf){ noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = R() * 2 - 1; }
  const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); s.buffer = noiseBuf; f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp || lp || 2000; g.gain.setValueAtTime(v || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(f); f.connect(g); g.connect(sfxG); s.start(t); s.stop(t + d + .02); }
const thr = {}; const ok2 = (k, ms) => { const n = performance.now(); if (thr[k] && n - thr[k] < ms) return false; thr[k] = n; return true; };
const SFX = {
  shot(){ if (ok2('shot', 45)){ tone(880, .06, 'square', .06, 300); noise(.04, .08, 3000); } },
  rail(){ tone(1600, .25, 'sawtooth', .12, 120); noise(.2, .15, 1200); },
  slash(){ if (ok2('sl', 60)){ noise(.09, .16, 2500); tone(420, .07, 'triangle', .07, 900); } },
  hit(){ if (ok2('hit', 35)) noise(.05, .12, 0, 1400); },
  boom(){ noise(.35, .32, 0, 600); tone(120, .3, 'sine', .3, 40); },
  dodge(){ noise(.12, .1, 4000); tone(600, .1, 'sine', .08, 1200); },
  bt(){ tone(200, .8, 'sine', .25, 60); tone(1200, .5, 'triangle', .1, 300); noise(.6, .12, 0, 900); },
  chain(){ [523, 784, 1046, 1568].forEach((f, i) => setTimeout(() => tone(f, .18, 'square', .1), i * 45)); noise(.3, .15, 2000); },
  tag(){ tone(700, .08, 'square', .08, 1400); },
  ult(){ tone(150, 1, 'sawtooth', .15, 900); [0, 80, 160, 240].forEach((d, i) => setTimeout(() => tone(400 + i * 200, .2, 'square', .08), d)); },
  hurt(){ if (ok2('hurt', 120)) tone(200, .15, 'sawtooth', .14, 80); },
  heal(){ [660, 880, 1100].forEach((f, i) => setTimeout(() => tone(f, .15, 'sine', .1), i * 70)); },
  ui(){ tone(1000, .04, 'square', .05); },
  win(){ [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .25, 'square', .1), i * 110)); },
  lose(){ [400, 300, 200].forEach((f, i) => setTimeout(() => tone(f, .3, 'triangle', .12), i * 160)); },
  pull(r){ const n = r === 'SSR' ? 6 : r === 'SR' ? 4 : 2; for (let i = 0; i < n; i++) setTimeout(() => tone(600 + i * 180, .16, 'square', .09), i * 70); if (r === 'SSR'){ setTimeout(() => { tone(1568, .8, 'triangle', .14); noise(.5, .1, 3000); }, n * 70); } },
};
// BGM: procedural synthwave
const BGM = { on:false, t:0, step:0, mode:'lobby', timer:0,
  start(mode){ if (!AC) return; this.mode = mode; if (this.on) return; this.on = true; this.t = AC.currentTime + .1; this.step = 0; this.timer = setInterval(() => this.sched(), 60); },
  stop(){ this.on = false; clearInterval(this.timer); },
  sched(){ if (!AC || !M.bgm) { this.t = AC ? AC.currentTime + .1 : 0; return; } const bpm = this.mode === 'battle' ? 132 : this.mode === 'boss' ? 146 : 96, st = 60 / bpm / 4;
    if (this.t < AC.currentTime) this.t = AC.currentTime + .05;
    while (this.t < AC.currentTime + .25){ const s = this.step % 64, bar = Math.floor(s / 16);
      const prog = this.mode === 'lobby' ? [57, 53, 48, 55] : [45, 41, 43, 40]; const root = prog[bar];
      const nf = n => 440 * Math.pow(2, (n - 69) / 12);
      const play = (f, d, type, v, at) => { const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter(); o.type = type; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.value = this.mode === 'lobby' ? 1400 : 2400;
        g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(v, at + .01); g.gain.exponentialRampToValueAtTime(.001, at + d); o.connect(lp); lp.connect(g); g.connect(bgmG); o.start(at); o.stop(at + d + .05); };
      if (this.mode === 'lobby'){
        if (s % 4 === 0) play(nf(root - 12), st * 3.5, 'triangle', .35, this.t);
        if (s % 2 === 0){ const ch = [0, 7, 12, 15, 19, 12, 7, 3]; play(nf(root + ch[(s / 2) % 8]), st * 1.8, 'sine', .12, this.t); }
        if (s % 16 === 0) [0, 3, 7].forEach(i => play(nf(root + 12 + i), st * 14, 'sawtooth', .025, this.t));
      } else {
        if (s % 2 === 0) play(nf(root - 12 + (s % 4 === 2 ? 12 : 0)), st * 1.6, 'sawtooth', .22, this.t);
        const ar = [0, 3, 7, 10, 12, 10, 7, 3]; play(nf(root + 24 + ar[s % 8]), st * .9, 'square', .05, this.t);
        if (s % 4 === 0){ const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(150, this.t); o.frequency.exponentialRampToValueAtTime(40, this.t + .12); g.gain.setValueAtTime(.5, this.t); g.gain.exponentialRampToValueAtTime(.001, this.t + .15); o.connect(g); g.connect(bgmG); o.start(this.t); o.stop(this.t + .2); }
        if (s % 8 === 4 && noiseBuf){ const n = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); n.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 1500; g.gain.setValueAtTime(.18, this.t); g.gain.exponentialRampToValueAtTime(.001, this.t + .12); n.connect(f); f.connect(g); g.connect(bgmG); n.start(this.t); n.stop(this.t + .15); }
        if (s % 2 === 1 && noiseBuf){ const n = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); n.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(.05, this.t); g.gain.exponentialRampToValueAtTime(.001, this.t + .04); n.connect(f); f.connect(g); g.connect(bgmG); n.start(this.t); n.stop(this.t + .05); }
      }
      this.t += st; this.step++; } } };
function btAudio(d){ if (!AC || !bgmLP) return; const t = AC.currentTime; bgmLP.frequency.cancelScheduledValues(t); bgmLP.frequency.setValueAtTime(20000, t); bgmLP.frequency.exponentialRampToValueAtTime(420, t + .12); bgmLP.frequency.setValueAtTime(420, t + d - .2); bgmLP.frequency.exponentialRampToValueAtTime(20000, t + d);
  for (let i = 0; i < d * 2; i++) setTimeout(() => { tone(i % 2 ? 1900 : 2600, .03, 'square', .07); noise(.02, .06, 6000); }, i * 500); }
